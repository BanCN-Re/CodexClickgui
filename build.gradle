plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'carnation'
}

loom {
	accessWidenerPath = file("src/main/resources/carnation.accesswidener")
}

// Client game tests (src/gametest) drive the real client and take screenshots of the GUI:
// .\gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "carnation-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

repositories {
}

dependencies {
	// 26.x ships unobfuscated, so there is no mappings line.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "org.luaj:luaj-jse:3.0.1"
	include "org.luaj:luaj-jse:3.0.1"

	compileOnly 'org.projectlombok:lombok:1.18.42'
	annotationProcessor 'org.projectlombok:lombok:1.18.42'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}
