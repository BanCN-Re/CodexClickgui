plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'carnation'
}

loom {
	accessWidenerPath = file("src/main/resources/carnation.accesswidener")

	// 26.3 renderpearl ships OpenGL and Vulkan backends; the wallpaper renders on Vulkan.
	runs {
		client {
			programArgs "--graphicsBackend", "vulkan"
		}
	}
}

// Client game tests (src/gametest) drive the real client and take screenshots of the GUI:
// .\gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "carnation-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

repositories {
}

dependencies {
	// 26.x ships unobfuscated, so there is no mappings line.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "org.luaj:luaj-jse:3.0.1"
	include "org.luaj:luaj-jse:3.0.1"

	// Title-screen video wallpaper: decoded on a background thread by the bundled FFmpeg.
	implementation 'org.bytedeco:javacpp:1.5.12'
	include 'org.bytedeco:javacpp:1.5.12'
	implementation 'org.bytedeco:javacv:1.5.12'
	include 'org.bytedeco:javacv:1.5.12'
	implementation 'org.bytedeco:ffmpeg:7.1.1-1.5.12'
	include 'org.bytedeco:ffmpeg:7.1.1-1.5.12'
	implementation 'org.bytedeco:ffmpeg:7.1.1-1.5.12:windows-x86_64'
	include 'org.bytedeco:ffmpeg:7.1.1-1.5.12:windows-x86_64'

	compileOnly 'org.projectlombok:lombok:1.18.42'
	annotationProcessor 'org.projectlombok:lombok:1.18.42'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

// configureTests (above) creates the clientGameTest run. Game tests intentionally run on
// OpenGL: the CI window is resized and screens swap rapidly, which repeatedly trips VK_ERROR_DEVICE_LOST
// on driver overlays; the Vulkan wallpaper path is still exercised by runClient.
afterEvaluate {
	def gametestRun = loom.runs.findByName('clientGameTest')
	if (gametestRun != null) {
		gametestRun.programArgs "--graphicsBackend", "opengl"
	}
}
